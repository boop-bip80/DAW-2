# Builds, tests, stages and exercises the candidate executable on each host OS.
# Distribution, external compatibility, physical hardware and signing remain separate release gates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # PR jobs otherwise check out GitHub's ephemeral merge ref. Release-candidate
  # manifests must identify the durable, exact source revision being built.
  CANDIDATE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: windows
            executable: target/release/lemonstudio.exe
            staged_executable: bin/lemonstudio.exe
          - name: Linux
            os: ubuntu-24.04
            platform: linux
            executable: target/release/lemonstudio
            staged_executable: bin/lemonstudio
          - name: macOS
            os: macos-latest
            platform: macos
            executable: target/release/lemonstudio
            staged_executable: Lemon Studio.app/Contents/MacOS/lemonstudio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}

      # ALSA (audio output and MIDI input). The app loads Wayland, X11 and xkbcommon at run time, but Lemon Sampler built
      # on its own (the bundle step) links wayland-client through its file dialogs, so that needs the Wayland package.
      # libclang: the time stretcher's bindings are generated at build time (the Windows image ships LLVM, the macOS one Xcode's).
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libjack-jackd2-dev libwayland-dev libclang-dev pkg-config

      # Match rust-toolchain.toml exactly; a floating `stable` would not be reproducible.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # The plugin bundles (VST3 + CLAP): the hosting tests load them, and skip without them.
      - name: Bundle plugins
        run: cargo run -p bundle-plugins --locked

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: cargo run -p bundle-app --locked

      # Every platform's crates: the notices test lists them with an offline `cargo tree --target all`.
      - name: Fetch
        run: cargo fetch --locked

      - name: Test
        run: cargo test --workspace --locked

      # macOS already built its release binary in bundle-app. Linux/Windows build here after tests.
      - name: Build release application
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p os-app --bin lemonstudio

      - name: Stage licensed and checksummed release candidate
        run: >-
          python tools/qualification/stage.py stage
          --platform "${{ matrix.platform }}"
          --binary "${{ matrix.executable }}"
          --bundled "target/bundled"
          --output "${{ runner.temp }}/lemon-candidate"
          --commit "${{ env.CANDIDATE_COMMIT }}"

      # This verifies only the existing ad-hoc signature, not trusted Developer ID or notarization.
      - name: Verify staged macOS bundle's ad-hoc signature
        if: runner.os == 'macOS'
        run: codesign --verify --verbose=2 "${{ runner.temp }}/lemon-candidate/payload/Lemon Studio.app"

      # Exercise the actual staged executable with a synthetic native session, cold reopen, render and take recovery.
      - name: Qualify staged executable with owned synthetic project
        run: >-
          python tools/qualification/owned_workflow.py
          --binary "${{ runner.temp }}/lemon-candidate/payload/${{ matrix.staged_executable }}"
          --output "${{ runner.temp }}/lemon-qualified"

      - name: Verify packaged file and archive hashes after qualification
        run: python tools/qualification/stage.py verify --output "${{ runner.temp }}/lemon-candidate"

      # Only successful, hash-verified candidates are downloadable. These are short-lived,
      # unsigned (macOS: ad-hoc-signed) test artifacts, NOT production releases.
      - name: Upload qualified portable candidate and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: lemon-${{ matrix.platform }}-${{ env.CANDIDATE_COMMIT }}
          path: |
            ${{ runner.temp }}/lemon-candidate/*.zip
            ${{ runner.temp }}/lemon-candidate/*.tar.gz
            ${{ runner.temp }}/lemon-candidate/*.sha256
            ${{ runner.temp }}/lemon-candidate/stage-result.json
            ${{ runner.temp }}/lemon-qualified/result.json
            ${{ runner.temp }}/lemon-qualified/*.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
